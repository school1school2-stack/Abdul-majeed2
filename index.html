        function initPullToRefresh() {
            let touchstartY = 0;
            const mainContainer = document.getElementById('main-scroll-container');

            if (mainContainer) {
                mainContainer.addEventListener('touchstart', e => {
                    touchstartY = e.touches[0].clientY;
                }, { passive: true });

                mainContainer.addEventListener('touchend', e => {
                    let touchendY = e.changedTouches[0].clientY;
                    if (mainContainer.scrollTop === 0 && touchendY - touchstartY > 120) {
                        location.reload();
                    }
                }, { passive: true });
            }
        }

        async function fetchClassesAndStudents() {
            try {
                const classDoc = await db.collection("system_settings").doc("classes_config").get();
                if (classDoc.exists && classDoc.data().classList) {
                    classList = classDoc.data().classList;
                } else {
                    classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
                    await db.collection("system_settings").doc("classes_config").set({ classList: classList });
                }
            } catch (e) {
                classList = ['الفصل الأول', 'الفصل الثاني', 'الفصل الثالث', 'الفصل الرابع'];
            }
            renderClassesListUI();
            renderView();
            fetchStudents();
        }

        async function saveClassesToCloud() {

        function fetchStudents() {
            const approvedTbody = document.querySelector("#studentsTable tbody");
            const pendingTbody = document.querySelector("#pendingTable tbody");
            const pendingSection = document.getElementById("pendingSection");

            db.collection("allowed_students").orderBy("name").onSnapshot((snapshot) => {
                let approvedCount = snapshot.size;
                if(approvedTbody) approvedTbody.innerHTML = "";
                const approvedCountEl = document.getElementById("approvedCount");
                if(approvedCountEl) approvedCountEl.innerText = `الطلاب المعتمدين: ${approvedCount}`;

                allStudents = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const email = doc.id;
                    const name = data.name || "";
                    
                    allStudents.push({
                        id: doc.id,
                        name: name,
                        email: email,
                        className: data.className || 'غير موزع',
                        phone: data.phone || '966566688614',
                        actions: data.actions || [],
                        attendanceStats: data.attendanceStats || { presents: 0, absents: 0, lates: 0 }
                    });
                    
                    if(approvedTbody) {
                        const tr = document.createElement('tr');
                        tr.setAttribute('data-name', name);
                        tr.setAttribute('data-email', email);

                        let classOptionsHtml = `<option value="" disabled>📁 تعيين لفصل دراسي</option>`;
                        classList.forEach(cls => {
                            const prefix = (data.className === cls) ? '✔️ ' : '';
                            classOptionsHtml += `<option value="class_${cls}">${prefix}${cls}</option>`;
                        });
                        classOptionsHtml += `<option value="class_غير موزع">❌ إزالة من الفصل</option>`;

                        tr.innerHTML = `
                            <td style="text-align: right; font-weight: bold; font-size: 0.9rem; color: #1e293b;">
                                ${name}
                                <div style="font-size: 0.75rem; color: #800000; margin-top: 2px;">الفصل: ${data.className || 'غير موزع'}</div>
                            </td>
                            <td style="font-size: 0.8rem; color: #475569;">${email}</td>
                            <td>
                                <select class="action-select" onchange="handleAction(this, '${email}', '${name.replace(/'/g, "\\'")}','${doc.id}')">
                                    <option value="" disabled selected>⚙️ خيارات الإجراء</option>
                                    <optgroup label="الفصول الدراسية">
                                        ${classOptionsHtml}
                                    </optgroup>
                                    <optgroup label="العمليات الأساسية">
                                        <option value="copy_email">📧 نسخ الإيميل</option>
                                        <option value="edit_email">✏️ تعديل الإيميل</option>
                                        <option value="copy_name">📋 نسخ الاسم</option>
                                        <option value="edit_name">✏️ تعديل الاسم</option>
                                        <option value="copy_both">📑 نسخ الكل (الاسم والإيميل)</option>
                                        <option value="whatsapp">📱 مشاركة عبر الواتساب</option>
                                        <option value="delete">🗑️ حذف الطالب</option>
                                    </optgroup>
                                </select>
                            </td>
                        `;
                        approvedTbody.appendChild(tr);
                    }
                });
                renderView();
                searchStudents();
                if(activeClass) renderClassStudents();
            });

            db.collection("pending_students").orderBy("name").onSnapshot((snapshot) => {
                let pendingCount = snapshot.size;
                pendingCountGlobal = pendingCount;
                if(pendingTbody) pendingTbody.innerHTML = "";
                const pendingBadge = document.getElementById("pendingCountBadge");
                if(pendingBadge) pendingBadge.innerText = `الطلبات المعلقة: ${pendingCount}`;
                if(pendingSection) pendingSection.style.display = pendingCount > 0 ? "block" : "none";
                renderView();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const email = doc.id;
                    if(pendingTbody) {
                        pendingTbody.innerHTML += `

        window.shareViaWhatsApp = function(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;
            
            let total = 0; 
            (student.actions || []).forEach(a => total += (a.score || 0));
            let att = student.attendanceStats || { presents: 0, absents: 0, lates: 0 };
            
            let msg = `🎓 تقرير متابعة الطالب: ${student.name}\n`;
            msg += `🏫 الفصل: ${student.className}\n\n`;
            msg += `📌 الحضور: ${att.presents} | الغياب: ${att.absents} \vert{} التأخر: ${att.lates}\n`;
            msg += `📊 مجموع النقاط والمشاركات: ${total}\n\n`;
            
            let negatives = (student.actions || []).filter(a => (a.score || 0) < 0).slice(0, 3);
            if(negatives.length > 0) {
                msg += `⚠️ آخر الملاحظات:\n`;
                negatives.forEach(n => msg += `- ${n.title} (${n.timestamp})\n`);
            } else {
                msg += `✨ سلوك ممتاز ولا توجد ملاحظات سلبية.\n`;
            }
            
            msg += `\n👨‍🏫 إعداد: أ/ عبدالعزيز الفيفي\nثانوية الأمير عبدالمجيد مع فيس تعبيري 👨‍🏫`;
            window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank');

            selectElement.value = ""; 

            if (action.startsWith('class_')) {
                const targetClass = action.replace('class_', '');
                await assignStudentClass(studentId, targetClass);
                return;
            }

            if (action === 'copy_email') copyText(email);
            else if (action === 'edit_email') editStudentEmail(email, currentName);
            else if (action === 'copy_name') copyText(currentName);
            else if (action === 'edit_name') editStudentName(email, currentName);
            else if (action === 'copy_both') copyText(`${currentName}\n${email}`);
            else if (action === 'whatsapp') shareViaWhatsApp(studentId);
            else if (action === 'delete') deleteAllowed(email);

            const newEmail = newEmailInput.trim().toLowerCase();

        async function superSmartBulkAdd() {
            const input = document.getElementById("bulkInput").value.trim();
            if(!input) return alert("يرجى لصق البيانات");

            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");
            const batch = db.batch();
            let count = 0;

            for(let i = 0; i < lines.length; i++) {
                let name = "", email = "";
                let currentLine = lines[i];

                if(currentLine.includes('@') && currentLine.includes(' ')) {
                    let parts = currentLine.split(/[\s-]+/);
                    email = parts.find(p => p.includes('@')).toLowerCase();
                    name = parts.filter(p => !p.includes('@')).join(' ');
                } else {
                    let nextLine = lines[i+1];
                    if(nextLine) {
                        if(!currentLine.includes('@') && nextLine.includes('@')) {
                            name = currentLine; email = nextLine.toLowerCase(); i++;
                        } else if(currentLine.includes('@') && !nextLine.includes('@')) {
                            email = currentLine.toLowerCase(); name = nextLine; i++;
                        }
                    }
                }

                if(name && email) {
                    const ref = db.collection("allowed_students").doc(email);
                    batch.set(ref, { name: name, className: 'غير موزع', added_at: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                    count++;
                }
            }

            if(count > 0) {
                await batch.commit();
                alert(`تم رفع واعتماد ${count} طالب مباشرة بنجاح!`);
                document.getElementById("bulkInput").value = "";
            } else { alert("تنسيق غير معروف. تأكد من وجود الاسم والإيميل."); }
        }

            let textToCopy = "";
            rows.forEach(row => {
                if (row.style.display !== "none") {
                    const name = row.getAttribute("data-name");
                    const email = row.getAttribute("data-email");
                    if(name && email) textToCopy += `${name}\n${email}\n`;

            });

            if(!textToCopy) return alert("لا توجد بيانات مطابقة للنسخ.");
            try {
                await navigator.clipboard.writeText(textToCopy.trim());
                alert("تم نسخ جميع الطلاب إلى الحافظة بنجاح! 📋");
            } catch (err) { alert("فشل النسخ تلقائياً."); }
        }

        function getCleanActionDetails(rawTitle) {
            let cleanName = rawTitle.trim();
            let displayIcon = '⭐';

            for (let ca of customActions) {
                if (cleanName.includes(ca.name)) {
                    cleanName = ca.name;
                    displayIcon = ca.icon || '⭐';
                    return { title: cleanName, icon: displayIcon };
                }
            }

            if (cleanName.includes('حاضر')) { return { title: 'حاضر', icon: '🟢' }; }
            if (cleanName.includes('غائب بعذر')) { return { title: 'غائب بعذر', icon: '👤' }; }
            if (cleanName.includes('غائب')) { return { title: 'غائب', icon: '🔴' }; }
            if (cleanName.includes('مستأذن')) { return { title: 'مستأذن', icon: '🔵' }; }
            if (cleanName.includes('متأخر')) { return { title: 'متأخر', icon: '⏰' }; }
            if (cleanName.includes('عن بعد')) { return { title: 'عن بعد', icon: '💻' }; }
            if (cleanName.includes('هارب')) { return { title: 'هارب', icon: '🚶‍♂️' }; }

            for (let ca of customActions) {
                if (cleanName === ca.icon || cleanName.includes(ca.icon)) {
                    return { title: ca.name, icon: ca.icon };
                }
            }

            return { title: cleanName, icon: displayIcon };
        }

        window.recordAction = async function(actionName, scoreChange = 0, attendanceType = null) {
            if(!currentStudentId) return;
            closeActionModal();

            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                const now = new Date();
                const dayName = now.toLocaleDateString('ar-SA', { weekday: 'long' });
                const dateFormatted = now.toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });
                const timeFormatted = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                const formattedTime = `${dayName} | ${dateFormatted} -${timeFormatted}`;

                let attendanceStats = student.attendanceStats || { presents: 0, absents: 0, lates: 0 };
                let actionsList = student.actions || [];
                
                if(attendanceType) {
                    if (attendanceType === 'حاضر') {
                        attendanceStats.presents = (attendanceStats.presents || 0) + 1;
                    } else if (attendanceType.includes('غائب')) {
                        attendanceStats.absents = (attendanceStats.absents || 0) + 1;
                    } else if (attendanceType === 'متأخر') {
                        attendanceStats.lates = (attendanceStats.lates || 0) + 1;
                    }
                }
                
                const newRecord = { title: actionName, score: scoreChange, timestamp: formattedTime };
                student.actions = [newRecord, ...actionsList];

                renderClassStudents();

                await db.collection("allowed_students").doc(currentStudentId).update({
                    actions: student.actions,
                    attendanceStats: attendanceStats
                });
            }
        };

            const student = allStudents.find(s => s.id === currentStudentId);

        window.adjustAttendance = async function(type, delta) {
            if(!currentStudentId) return;
            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                let att = student.attendanceStats || { presents: 0, absents: 0, lates: 0 };
                if(type === 'presents') att.presents = Math.max(0, (att.presents || 0) + delta);
                if(type === 'absents') att.absents = Math.max(0, (att.absents || 0) + delta);
                if(type === 'lates') att.lates = Math.max(0, (att.lates || 0) + delta);

        function calculateStudentSummaryData(student) {
            const att = student.attendanceStats || { presents: 0, absents: 0, lates: 0 };
            const actions = student.actions || [];
            const todayStr = new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });

            let positiveCountToday = 0;
            let positiveCountTotal = 0;
            let totalPositiveScore = 0;
            let totalScore = 0;

            let negativeList = [];
            let homeworkList = [];
            let portfolioList = [];
            let attendanceEventsList = [];

            actions.forEach(act => {
                const score = act.score || 0;
                const title = act.title || '';
                const isToday = act.timestamp && act.timestamp.includes(todayStr);

                totalScore += score;

                if (score > 0) {
                    positiveCountTotal++;
                    totalPositiveScore += score;
                    if (isToday) positiveCountToday++;
                }

                if (title.includes('غائب') || title.includes('متأخر') || title.includes('مستأذن') || title.includes('حاضر') || title.includes('هارب')) {
                    attendanceEventsList.push(act);
                }

                if (title.includes('واجب')) {
                    homeworkList.push(act);
                } else if (title.includes('ملف') || title.includes('إنجاز')) {
                    portfolioList.push(act);
                } else if (score < 0 || title.includes('نوم') || title.includes('تحدث') || title.includes('هاتف') || title.includes('خاطئة')) {
                    negativeList.push(act);
                }
            });

            return {
                att,
                actions,
                totalScore,
                positiveCountToday,
                positiveCountTotal,
                totalPositiveScore,
                negativeList,
                homeworkList,
                portfolioList,
                attendanceEventsList
            };
        }
