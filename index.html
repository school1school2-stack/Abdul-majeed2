        // XSS Protection
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function initSystem() {
            window.currentTheme = themes[0];
            customActions = defaultActions;
            fetchClassesAndStudents();

            renderSettingsActionsDropdown();

        async function fetchClassesAndStudents() {
            try {
                const classDoc = await db.collection("system_settings").doc("classes_config").get();
                if (classDoc.exists && classDoc.data().classList) {
                    classList = classDoc.data().classList;
                } else {
                    classList = ['الفصل الأول', 'الفصل الثاني'];
                    await db.collection("system_settings").doc("classes_config").set({ classList: classList });
                }
            } catch (e) { classList = ['الفصل الأول', 'الفصل الثاني']; }
            renderClassesListUI();
            renderView();
            fetchStudents();
        }

        async function saveClassesToCloud() {
            try { await db.collection("system_settings").doc("classes_config").set({ classList: classList }); } 
            catch (e) { console.error("خطأ", e); }
        }

        function fetchStudents() {
            const approvedTbody = document.querySelector("#studentsTable tbody");
            const pendingTbody = document.querySelector("#pendingTable tbody");

            db.collection("allowed_students").orderBy("name").onSnapshot((snapshot) => {
                if(approvedTbody) approvedTbody.innerHTML = "";
                document.getElementById("approvedCount").innerText = `الطلاب المعتمدين: ${snapshot.size}`;

                allStudents = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const email = escapeHTML(doc.id);
                    const name = escapeHTML(data.name || "");
                    
                    allStudents.push({
                        id: doc.id, name: name, email: email,
                        className: escapeHTML(data.className || 'غير موزع'),
                        actions: data.actions || [],
                        attendanceStats: data.attendanceStats || { presents: 0, absents: 0, lates: 0 }
                    });
                    
                    if(approvedTbody) {
                        let classOptionsHtml = `<option value="" disabled>📁 تعيين لفصل</option>`;
                        classList.forEach(cls => {
                            classOptionsHtml += `<option value="class_${cls}">${data.className === cls ? '✔️ ' : ''}${escapeHTML(cls)}</option>`;
                        });
                        classOptionsHtml += `<option value="class_غير موزع">❌ إزالة من الفصل</option>`;

                        approvedTbody.innerHTML += `
                            <tr data-name="${name}" data-email="${email}">
                                <td style="text-align: right; font-weight: bold;">
                                    ${name} <div style="font-size: 0.75rem; color: #800000;">الفصل: ${data.className || 'غير موزع'}</div>
                                </td>
                                <td>${email}</td>
                                <td>
                                    <select class="action-select" onchange="handleAction(this, '${email}', '${name}','${doc.id}')">
                                        <option value="" disabled selected>⚙️ خيارات</option>
                                        <optgroup label="الفصول">${classOptionsHtml}</optgroup>
                                        <optgroup label="العمليات">
                                            <option value="edit_email">✏️ تعديل الإيميل</option>
                                            <option value="edit_name">✏️ تعديل الاسم</option>
                                            <option value="delete">🗑️ حذف</option>
                                        </optgroup>
                                    </select>
                                </td>
                            </tr>
                        `;
                    }
                });
                renderView();
                if(activeClass) renderClassStudents();
            });

            db.collection("pending_students").orderBy("name").onSnapshot((snapshot) => {
                pendingCountGlobal = snapshot.size;
                if(pendingTbody) pendingTbody.innerHTML = "";
                document.getElementById("pendingCountBadge").innerText = `المعلقة: ${pendingCountGlobal}`;
                document.getElementById("pendingSection").style.display = pendingCountGlobal > 0 ? "block" : "none";
                renderView();
                snapshot.forEach((doc) => {
                    if(pendingTbody) pendingTbody.innerHTML += `<tr><td>${escapeHTML(doc.data().name)}</td><td>${escapeHTML(doc.id)}</td><td>
                        <button class="btn-approve" onclick="approveStudent('${doc.id}', '${escapeHTML(doc.data().name)}')">✅</button>
                        <button class="btn-reject" onclick="deletePending('${doc.id}')">❌</button>
                    </td></tr>`;
                });
            });
        }

        window.handleAction = async function(selectElement, email, currentName, studentId) {
            const action = selectElement.value; selectElement.value = ""; 
            if (action.startsWith('class_')) await assignStudentClass(studentId, action.replace('class_', ''));
            else if (action === 'edit_email') editStudentEmail(email, currentName);
            else if (action === 'edit_name') editStudentName(email, currentName);
            else if (action === 'delete') deleteAllowed(email);
        };

        async function assignStudentClass(studentId, newClass) {
            await db.collection("allowed_students").doc(studentId).update({ className: newClass });
        }

        async function editStudentName(email, currentName) {
            const newName = prompt("أدخل الاسم الجديد:", currentName);
            if (newName && newName.trim()) await db.collection("allowed_students").doc(email).update({ name: newName.trim() });
        }

        async function editStudentEmail(currentEmail, currentName) {
            const newEmailInput = prompt("أدخل الإيميل الجديد (سيتم نقل كافة البيانات):", currentEmail);
            if (!newEmailInput) return;
            const newEmail = newEmailInput.trim().toLowerCase();
            if (!newEmail.includes('@') || newEmail === currentEmail) return;
            
            try {
                const docCheck = await db.collection("allowed_students").doc(newEmail).get();
                if (docCheck.exists) return alert("هذا البريد موجود مسبقاً!");

                const oldDoc = await db.collection("allowed_students").doc(currentEmail).get();
                const oldData = oldDoc.exists ? oldDoc.data() : { name: currentName, className: 'غير موزع' };

                await db.collection("allowed_students").doc(newEmail).set(oldData); // نسخ جميع البيانات القديمة للجديدة
                await db.collection("allowed_students").doc(currentEmail).delete(); // حذف القديمة
                alert("تم تحديث الإيميل ونقل جميع الدرجات والسجل بنجاح!");
            } catch (error) { alert("حدث خطأ."); }
        }

        async function approveStudent(email, name) {
            await db.collection("allowed_students").doc(email).set({ name: name, className: 'غير موزع', added_at: new Date() });
            await db.collection("pending_students").doc(email).delete();
        }

        async function deletePending(email) { if(confirm('رفض؟')) await db.collection("pending_students").doc(email).delete(); }
        async function deleteAllowed(email) { if(confirm('حذف الطالب نهائياً؟')) await db.collection("allowed_students").doc(email).delete(); }

        async function superSmartBulkAdd() {
            const input = document.getElementById("bulkInput").value.trim();
            if(!input) return;
            
            // دعم لصق الاسم والإيميل في سطر واحد (مفصولين بمسافة أو شرطة) أو سطرين
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");
            const batch = db.batch();
            let count = 0;

            for(let i = 0; i < lines.length; i++) {
                let name = "", email = "";
                let currentLine = lines[i];

                if(currentLine.includes('@') && currentLine.includes(' ')) {
                    // سطر واحد يحتوي على اسم وإيميل
                    let parts = currentLine.split(/[\s-]+/);
                    email = parts.find(p => p.includes('@')).toLowerCase();
                    name = parts.filter(p => !p.includes('@')).join(' ');
                } else {
                    // نظام السطرين المتتاليين
                    let nextLine = lines[i+1];
                    if(nextLine) {
                        if(!currentLine.includes('@') && nextLine.includes('@')) {
                            name = currentLine; email = nextLine.toLowerCase(); i++;
                        } else if(currentLine.includes('@') && !nextLine.includes('@')) {
                            email = currentLine.toLowerCase(); name = nextLine; i++;
                        }
                    }
                }

                if(name && email) {
                    batch.set(db.collection("allowed_students").doc(email), { 
                        name: name, className: 'غير موزع', added_at: new Date() 
                    }, { merge: true });
                    count++;
                }
            }

            if(count > 0) {
                await batch.commit();
                alert(`تم رفع ${count} طالب بنجاح!`);
                document.getElementById("bulkInput").value = "";
            } else { alert("تنسيق غير مدعوم. أضف (الاسم) ثم (الإيميل)."); }
        }

            activeClass = className;

        function renderView() {
            const container = document.getElementById('dynamic-classes-grid');
            if(!container) return;
            container.innerHTML = '';
            classList.forEach(cls => {
                const count = allStudents.filter(s => s.className === cls).length;

                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t">

                    <div class="flex items-center gap-4">
                        <span class="text-4xl">🔒</span>
                        <div>

                        </div>
                    </div>
                </div>
            `;
        }

        function renderClassStudents() {
            if(!activeClass) return;
            const container = document.getElementById('class-students-container');
            container.innerHTML = '';
            const students = allStudents.filter(s => s.className === activeClass);

            students.forEach(student => {
                let totalScore = 0;
                (student.actions || []).forEach(act => totalScore += (act.score || 0));
                
                container.innerHTML += `
                    <div class="student-square-card p-4 rounded-3xl flex flex-col gap-3">
                        <div class="flex items-center justify-between cursor-pointer" onclick="openModal('${student.id}')">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">👤</span>
                                <div>
                                    <h3 class="student-name-font text-slate-900 text-lg">${student.name}</h3>
                                    <p class="text-xs text-slate-500">${student.email}</p>
                                </div>
                            </div>
                            <span class="font-black text-lg ${totalScore >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${totalScore > 0 ? '+'+totalScore : totalScore}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-auto">
                            <button onclick="openActionModal('${student.id}')" class="bg-stone-800 text-amber-50 py-2 rounded-xl text-xs font-bold">📝 رصد ومتابعة</button>
                            <button onclick="openModal('${student.id}')" class="bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">📊 تقرير الطالب</button>
                        </div>
                    </div>
                `;
            });
        }

        // إرسال التقرير عبر الواتساب كنص
        window.shareViaWhatsApp = function(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;
            let total = 0; (student.actions||[]).forEach(a => total+=a.score);
            let att = student.attendanceStats || {};
            
            let msg = `🎓 تقرير متابعة الطالب: ${student.name}\n`;
            msg += `🏫 الفصل: ${student.className}\n\n`;
            msg += `📌 الحضور: ${att.presents||0} | الغياب: ${att.absents||0} | التأخر: ${att.lates||0}\n`;
            msg += `📊 مجموع النقاط السلوكية/المشاركات: ${total}\n\n`;
            msg += `آخر الملاحظات السلبية:\n`;
            let negatives = (student.actions||[]).filter(a => a.score < 0).slice(0, 3);
            if(negatives.length === 0) msg += `- سلوك ممتاز ولا توجد ملاحظات سلبية ✨\n`;
            else negatives.forEach(n => msg += `- ${n.title} (${n.timestamp})\n`);
            
            msg += `\n👨‍🏫 المعلم: أ/ عبدالعزيز الفيفي\nثانوية الأمير عبدالمجيد`;
            window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg));
        };

        // تصدير الفصل إلى إكسل
        window.exportClassToCSV = function(className) {
            const students = allStudents.filter(s => s.className === className);
            if(students.length === 0) return alert('لا يوجد طلاب في هذا الفصل');
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // لدعم اللغة العربية
            csvContent += "الاسم,الايميل,الحضور,الغياب,التأخر,النقاط الكلية\n";
            
            students.forEach(st => {
                let total = 0; (st.actions||[]).forEach(a => total+=a.score);
                let att = st.attendanceStats || {};
                let row = `"${st.name}","${st.email}","${att.presents||0}","${att.absents||0}","${att.lates||0}","${total}"`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `تقرير_${className}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // تصفير بيانات الفصل
        window.resetClassData = async function(className) {
            if(!confirm(`تحذير: هل أنت متأكد من مسح جميع السجلات والغيابات والدرجات لطلاب ( ${className} ) وبداية تقييم جديد؟ (الأسماء ستبقى موجودة)`)) return;
            
            const students = allStudents.filter(s => s.className === className);
            const batch = db.batch();
            
            students.forEach(st => {
                const ref = db.collection("allowed_students").doc(st.id);
                batch.update(ref, {
                    actions: [],
                    attendanceStats: { presents: 0, absents: 0, lates: 0 }
                });
            });
            
            await batch.commit();
            alert('تم تصفير البيانات بنجاح!');
        };

        window.recordAction = async function(actionName, scoreChange) {
            if(!currentStudentId) return;
            const student = allStudents.find(s => s.id === currentStudentId);
            if(student) {
                const now = new Date();
                const timeStr = `${now.toLocaleDateString('ar-SA')} - ${now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'})}`;
                
                let att = student.attendanceStats || { presents: 0, absents: 0, lates: 0 };
                if (actionName === 'حاضر') att.presents++;
                else if (actionName.includes('غائب')) att.absents++;
                else if (actionName === 'متأخر') att.lates++;
                
                const newRecord = { title: actionName, score: scoreChange, timestamp: timeStr, timeIso: now.toISOString() };
                student.actions = [newRecord, ...(student.actions || [])];

                await db.collection("allowed_students").doc(currentStudentId).update({
                    actions: student.actions, attendanceStats: att
                });
                closeActionModal();
                renderClassStudents();
            }
        };

        window.openModal = function(id) {
            currentStudentId = id;
            const st = allStudents.find(s => s.id === id);
            if(!st) return;
            
            let total = 0; (st.actions||[]).forEach(a => total+=a.score);
            let att = st.attendanceStats || {};

            let modalContent = `
                <div class="text-center mb-4 border-b pb-4">
                    <h2 class="text-2xl font-bold">${st.name}</h2>
                    <p class="text-slate-500">${st.className} | المجموع: <strong class="${total>=0?'text-emerald-600':'text-rose-600'}">${total}</strong></p>
                </div>
                <div class="flex justify-around mb-4 bg-slate-50 p-3 rounded-xl border text-sm font-bold">
                    <span class="text-emerald-600">حضور: ${att.presents||0}</span>
                    <span class="text-rose-600">غياب: ${att.absents||0}</span>
                    <span class="text-amber-600">تأخر: ${att.lates||0}</span>
                </div>
                <div class="max-h-48 overflow-y-auto mb-4 border p-2 rounded-xl text-sm">
                    ${(st.actions||[]).map(a => `<div class="p-2 border-b flex justify-between"><span>${a.title}</span><span class="text-xs text-slate-400">${a.timestamp}</span></div>`).join('')}
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="shareViaWhatsApp('${st.id}')" class="bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold">📲 إرسال لولي الأمر (واتس)</button>
                    <button onclick="closeModal()" class="bg-slate-200 text-slate-800 py-2 rounded-xl text-xs font-bold">إغلاق</button>
                </div>
            `;
            document.getElementById('modal-content').innerHTML = modalContent;
            document.getElementById('student-modal').classList.remove('hidden');
            document.getElementById('student-modal').classList.add('flex');
        };
        
        window.closeModal = () => { document.getElementById('student-modal').classList.add('hidden'); document.getElementById('student-modal').classList.remove('flex'); };
        
        window.openActionModal = (id) => { currentStudentId = id; document.getElementById('action-modal').classList.remove('hidden'); document.getElementById('action-modal').classList.add('flex'); };
        window.closeActionModal = () => { document.getElementById('action-modal').classList.add('hidden'); document.getElementById('action-modal').classList.remove('flex'); };

        window.renderCustomActionsUI = function() {
            const container = document.getElementById('custom-actions-container');
            if(!container) return;
            container.innerHTML = customActions.map(act => `
                <button onclick="recordAction('${act.name}', ${act.score})" class="bg-white border p-3 rounded-xl shadow-sm text-right font-bold text-sm">
                    ${act.icon} ${act.name} (${act.score > 0 ? '+'+act.score : act.score})
                </button>
            `).join('');
        };
        window.renderSettingsActionsDropdown = function() {}; // Dummy for brevity in settings

    </script>
</head>
<body class="text-slate-900 h-full flex flex-col overflow-hidden bg-slate-50">

    <!-- شاشة تسجيل الدخول للحماية -->
    <div id="login-screen">
        <div class="login-box">
            <div class="text-6xl mb-4">👨‍🏫</div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">تسجيل الدخول</h2>
            <p class="text-sm text-slate-500 mb-6 font-bold">نظام متابعة الطلاب - أ/ عبدالعزيز الفيفي</p>
            <input type="password" id="sys-password" placeholder="أدخل الرقم السري..." class="w-full border-2 border-slate-300 p-3 rounded-xl mb-4 text-center font-bold outline-none focus:border-amber-500" onkeypress="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" class="w-full bg-[#800000] text-[#d4af37] py-3 rounded-xl font-bold text-lg hover:bg-[#4a0000] transition cursor-pointer">دخول النظام 🚀</button>
        </div>
    </div>

    <!-- واجهة النظام المخفية إلا بعد التسجيل -->
    <div id="main-app" class="hidden flex-col h-full w-full overflow-hidden">
        
        <!-- الترويسة العلوية -->
        <header id="main-header" class="bg-amber-50 border-b border-amber-200 p-4 shrink-0 z-30">
            <div class="container mx-auto max-w-6xl flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-black text-amber-950">نظام المتابعة السحابي الشامل</h1>
                    <p class="text-xs font-bold text-amber-800">أ/ عبدالعزيز الفيفي | ثانوية الأمير عبدالمجيد</p>
                </div>
            </div>
        </header>

        <!-- المحتوى القابل للتمرير -->
        <main id="main-scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-6 container mx-auto max-w-6xl w-full">
            
            <!-- القائمة الرئيسية -->
            <div id="main-dashboard" class="py-2 space-y-6">
                <div id="dynamic-classes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full"></div>
            </div>

            <!-- لوحة التحكم -->
            <div id="admin-control-view" class="hidden py-2 space-y-4">
                <button onclick="backToHome()" class="bg-white border text-slate-800 px-4 py-2 rounded-xl font-bold text-xs">⬅ العودة للفصول</button>
                <div class="admin-card">
                    <h2 class="text-lg font-black mb-4">لوحة التحكم السريعة</h2>
                    <div class="bulk-section">
                        <label class="block mb-2 text-xs font-bold">إضافة جماعية (اكتب الاسم ثم الإيميل أو بجانب بعضهما):</label>
                        <textarea id="bulkInput" placeholder="أحمد محمد - ahmed@gmail.com"></textarea>
                        <div class="controls mt-2">
                            <button class="btn btn-upload" onclick="superSmartBulkAdd()">رفع واعتماد</button>
                        </div>
                    </div>
                    <div class="stats-bar"><span id="approvedCount">الطلاب: 0</span> <span id="pendingCountBadge">المعلقة: 0</span></div>
                    <div id="pendingSection" class="pending-section"><h3>طلبات معلقة</h3><table id="pendingTable"><tbody></tbody></table></div>
                    <table id="studentsTable"><tbody></tbody></table>
                </div>
            </div>

            <!-- صفحة الفصل -->
            <div id="class-view" class="hidden py-1">
                <div class="flex items-center justify-between mb-4 bg-white p-3.5 rounded-2xl border">
                    <button onclick="backToHome()" class="bg-slate-100 px-4 py-2 rounded-xl font-bold text-xs">⬅ الرئيسية</button>
                    <h2 class="text-base font-black" id="class-title-header">الفصل</h2>
                    <div class="w-12"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="class-students-container"></div>
            </div>
        </main>
    </div>

    <!-- نافذة تقرير الطالب -->
    <div id="student-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-3 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 bg-slate-100 w-8 h-8 rounded-full font-bold">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- نافذة الرصد السريع -->
    <div id="action-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-3 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
            <button onclick="closeActionModal()" class="absolute top-4 left-4 bg-slate-100 w-8 h-8 rounded-full font-bold">✕</button>
            <h3 class="text-xl font-black text-center mb-4">تسجيل حضور ومشاركة</h3>
            <div class="flex gap-2 overflow-x-auto mb-4 pb-2">
                <button onclick="recordAction('حاضر', 0)" class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-xl font-bold shrink-0">🟢 حاضر</button>
                <button onclick="recordAction('غائب', 0)" class="bg-rose-100 text-rose-800 px-4 py-2 rounded-xl font-bold shrink-0">🔴 غائب</button>
                <button onclick="recordAction('متأخر', 0)" class="bg-amber-100 text-amber-800 px-4 py-2 rounded-xl font-bold shrink-0">⏰ متأخر</button>
            </div>
            <div id="custom-actions-container" class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1"></div>
        </div>
    </div>

</body>
</html>
